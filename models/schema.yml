version: 2

sources: 
- name: raw
  database: just-student-475409-a2
  schema: gz_raw_data
  loader: bigquery
  description: Gz_raw data set 
  freshness:
    warn_after: {count: 12, period: hour}
    error_after: {count: 24, period: hour}
  tables:
    -  name: sales
       identifier: raw_gz_sales
       description: sales of Greenweez 
       columns:
          - name: orders_id
            description: column
            tests:
              - not_null          
       tests: 
        - unique:
            column_name: "(orders_id || '-' || pdt_id)"

      
    - name: ship
      identifier: raw_gz_ship
      description: Ship of Greenweez
      columns:
         - name: orders_id
           description: primary key
           tests:
              - unique
              - not_null    
    - name: product
      identifier: raw_gz_product
      description: product of Greenweez 
      columns:
        - name: products_id
          description: product_id
          tests:
            - unique
            - not_null
        - name: purchSE_PRICE
            
       
      
      


  
